# Registry draft — app schema: contracts/harness-manifest.schema.json
# Static declaration only. Actual health, auth and capability checks happen at run time.
# Endpoint & prices MUST be verified before enabling real execution.
version: 1
harnesses:
  - id: pi-browser
    kind: external_agent_runtime
    transport: pi_rpc
    enabled: true
    permissions: [public_web_read, screenshot]
    capabilities: [browser.navigate, browser.extract, browser.screenshot]
    default_timeout_ms: 120000
    routes:
      - id: pi-browser:configured
        description: Execute browser tasks through an actual Pi agent and reviewed extension.
        agent_model_profile: configured
        modalities: [text, screenshot]
        eligible_requirements: [browser, screenshot, public_site_research]
        price_usd: null
        price_status: unknown

  - id: fal-creative
    kind: custom_agent_harness
    transport: in_process
    enabled: true
    permissions: [paid_media_generation]
    capabilities: [media.text_to_image]
    default_timeout_ms: 180000
    routes:
      - id: fal-creative:image-fast
        description: Specialist low-latency image workflow; budget-aware planning, fal queue and output verification.
        generation_model_id: fal-ai/flux/schnell
        modalities: [image]
        eligible_requirements: [text_to_image, image]
        price_usd: null
        price_status: unverified
        # Verify exact endpoint schema, parameters and current price before enabling.
      - id: fal-creative:image-quality
        description: Alternative quality-oriented image model profile; must verify endpoint before enabling.
        generation_model_id: null
        modalities: [image]
        eligible_requirements: [text_to_image, image]
        price_usd: null
        price_status: unverified
        enabled: false

  - id: native
    kind: host_defer
    transport: none
    enabled: true
    permissions: []
    capabilities: [coding, host_owned_tasks]
    default_timeout_ms: 0
    routes:
      - id: native:defer
        description: Do not spawn nested Codex; return task to current host for native handling.
        modalities: [text]
        eligible_requirements: [coding, unsupported_fallback]
        price_usd: null
        price_status: not_applicable
